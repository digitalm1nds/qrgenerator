<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e0e;
      --surface:  #161616;
      --border:   #2a2a2a;
      --accent:   #c8f135;
      --text:     #e8e8e0;
      --muted:    #5a5a50;
      --danger:   #ff6b5a;
      --radius:   4px;
    }

    [hidden] { display: none !important; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,241,53,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,241,53,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 56px;
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    header h1 em {
      font-style: italic;
      color: var(--accent);
    }
    header .badge {
      font-size: .65rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 4px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px;
      margin-bottom: 24px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 28px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 9px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0e0e0e;
      font-weight: 500;
    }
    .tab-btn:hover:not(.active) {
      color: var(--text);
      background: var(--border);
    }

    /* ── Inputs ── */
    label {
      display: block;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    input[type="text"], input[type="url"], input[type="email"], input[type="tel"], input[type="number"], textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: .85rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s;
      resize: vertical;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    textarea { min-height: 90px; }
    select option { background: #1a1a1a; }

    .field { margin-bottom: 20px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .hint {
      font-size: .72rem;
      color: var(--muted);
      line-height: 1.6;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    .hint strong { color: var(--accent); font-weight: 500; }
    .bc-error { color: var(--danger); font-size: .75rem; margin-bottom: 16px; }

    /* ── Options row ── */
    .options-row {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .opt-group { display: flex; align-items: center; gap: 10px; }
    .opt-group label { margin: 0; font-size: .68rem; white-space: nowrap; }
    input[type="color"] {
      width: 34px; height: 34px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 2px;
      cursor: pointer;
    }
    input[type="range"] {
      accent-color: var(--accent);
      width: 110px;
    }
    .range-val {
      font-size: .7rem;
      color: var(--accent);
      min-width: 28px;
    }

    /* ── Generate button ── */
    .gen-btn {
      width: 100%;
      margin-top: 24px;
      background: var(--accent);
      color: #0e0e0e;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Mono', monospace;
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 15px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      position: relative;
      overflow: hidden;
    }
    .gen-btn:hover { opacity: .88; }
    .gen-btn:active { transform: scale(.99); }
    .gen-btn:disabled { opacity: .5; cursor: wait; }
    .gen-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity .3s;
    }
    .gen-btn.flash::after { animation: flash .3s ease; }
    @keyframes flash { 0%,100%{opacity:0} 50%{opacity:.12} }

    /* ── Output ── */
    .output {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeUp .35s ease both;
    }
    .output.visible { display: flex; }
    @keyframes fadeUp {
      from { opacity:0; transform: translateY(16px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .qr-wrap {
      background: white;
      border-radius: 6px;
      padding: 20px;
      box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.6);
      transition: box-shadow .3s;
    }
    .qr-wrap:hover {
      box-shadow: 0 0 0 1px var(--accent), 0 24px 80px rgba(200,241,53,.15);
    }
    #qr-code canvas, #qr-code img { display: block; }

    .meta {
      text-align: center;
    }
    .meta .url-display {
      font-size: .78rem;
      color: var(--muted);
      word-break: break-all;
      max-width: 360px;
    }
    .meta .url-display span {
      color: var(--accent);
    }

    .dl-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .dl-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 10px 20px;
      margin: 0;
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
      text-decoration: none;
      display: inline-block;
    }
    .dl-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200,241,53,.05);
    }
    .dl-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0e0e0e;
    }
    .dl-btn.primary:hover { opacity: .85; }

    /* ── Barcodes ── */
    .bc-output { align-items: stretch; }
    .bc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
      width: 100%;
    }
    .bc-label {
      background: #fff;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 0 1px var(--border);
    }
    .bc-label svg { display: block; max-width: 100%; height: auto; }
    .bc-actions { display: flex; gap: 6px; }
    .bc-actions .dl-btn {
      padding: 6px 12px;
      font-size: .62rem;
      color: #0e0e0e;
      border-color: #ccc;
    }
    .bc-actions .dl-btn:hover {
      background: #0e0e0e;
      border-color: #0e0e0e;
      color: var(--accent);
    }
    .bc-history { margin-top: 24px; }
    .bc-history-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .bc-history-head .hint { margin: 0; }

    /* ── Footer ── */
    footer {
      position: relative; z-index: 1;
      margin-top: 48px;
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Tab panes ── */
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    @media (max-width: 520px) {
      .card, .output { padding: 24px; }
      .row { grid-template-columns: 1fr; }
      .options-row { flex-direction: column; align-items: flex-start; }
      .tab-btn { flex: 1 1 30%; }
    }

    /* ── Printing barcode labels (only when "Print labels" is pressed) ── */
    @media print {
      body.print-bc { background: #fff; padding: 0; display: block; }
      body.print-bc::before,
      body.print-bc header,
      body.print-bc .card,
      body.print-bc footer,
      body.print-bc #output { display: none !important; }
      body.print-bc #bc-output {
        display: block !important;
        border: none; padding: 0; background: none; animation: none;
      }
      body.print-bc #bc-output .dl-row,
      body.print-bc .bc-actions { display: none !important; }
      body.print-bc .bc-grid { grid-template-columns: repeat(3, 1fr); gap: 6mm; }
      body.print-bc .bc-label { box-shadow: none; padding: 0; break-inside: avoid; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>QR</h1>
    <div class="badge">Generator</div>
  </header>

  <div class="card">
    <!-- Tabs -->
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="url">URL</button>
      <button class="tab-btn" data-tab="text">Text</button>
      <button class="tab-btn" data-tab="wifi">Wi-Fi</button>
      <button class="tab-btn" data-tab="vcard">vCard</button>
      <button class="tab-btn" data-tab="email">Email</button>
      <button class="tab-btn" data-tab="barcode">Barcode</button>
    </div>

    <!-- URL -->
    <div class="tab-pane active" id="pane-url">
      <div class="field">
        <label>Website URL</label>
        <input type="url" id="url-input" placeholder="https://example.com" />
      </div>
    </div>

    <!-- Text -->
    <div class="tab-pane" id="pane-text">
      <div class="field">
        <label>Plain Text</label>
        <textarea id="text-input" placeholder="Enter any text…"></textarea>
      </div>
    </div>

    <!-- Wi-Fi -->
    <div class="tab-pane" id="pane-wifi">
      <div class="row">
        <div class="field">
          <label>Network Name (SSID)</label>
          <input type="text" id="wifi-ssid" placeholder="MyNetwork" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="text" id="wifi-pass" placeholder="••••••••" />
        </div>
      </div>
      <div class="field">
        <label>Security</label>
        <select id="wifi-sec">
          <option value="WPA">WPA / WPA2</option>
          <option value="WEP">WEP</option>
          <option value="">None</option>
        </select>
      </div>
    </div>

    <!-- vCard -->
    <div class="tab-pane" id="pane-vcard">
      <div class="row">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="vc-name" placeholder="Name" />
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="tel" id="vc-phone" placeholder="+961xxxxxxxx" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Email</label>
          <input type="email" id="vc-email" placeholder="ex@example.com" />
        </div>
        <div class="field">
          <label>Website</label>
          <input type="url" id="vc-url" placeholder="https://example.com" />
        </div>
      </div>
      <div class="field">
        <label>Organization</label>
        <input type="text" id="vc-org" placeholder="Organization" />
      </div>
    </div>

    <!-- Email -->
    <div class="tab-pane" id="pane-email">
      <div class="field">
        <label>Recipient Email</label>
        <input type="email" id="em-to" placeholder="hello@example.com" />
      </div>
      <div class="field">
        <label>Subject</label>
        <input type="text" id="em-subject" placeholder="Hello there" />
      </div>
      <div class="field">
        <label>Body</label>
        <textarea id="em-body" placeholder="Your message…"></textarea>
      </div>
    </div>

    <!-- Barcode -->
    <div class="tab-pane" id="pane-barcode">
      <div class="row">
        <div class="field">
          <label for="bc-prefix">Store name or initials</label>
          <input type="text" id="bc-prefix" placeholder="NAME" maxlength="20" autocomplete="off" />
        </div>
        <div class="field">
          <label for="bc-qty">How many barcodes</label>
          <input type="number" id="bc-qty" min="1" max="100" value="1" />
        </div>
      </div>
      <p class="hint" id="bc-info">Codes will look like <strong>NAME-482913</strong>. Letters and digits only; accents and spaces are removed.</p>
      <p class="bc-error" id="bc-error" hidden></p>
    </div>

    <!-- Options -->
    <div class="options-row">
      <div class="opt-group">
        <label>Foreground</label>
        <input type="color" id="opt-fg" value="#000000" />
      </div>
      <div class="opt-group">
        <label>Background</label>
        <input type="color" id="opt-bg" value="#ffffff" />
      </div>
      <div class="opt-group" id="size-group">
        <label>Size</label>
        <input type="range" id="opt-size" min="128" max="512" step="32" value="256" />
        <span class="range-val" id="size-label">256</span>
      </div>
    </div>

    <button class="gen-btn" id="gen-btn">Generate QR Code</button>
  </div>

  <!-- QR output -->
  <div class="output" id="output">
    <div class="qr-wrap">
      <div id="qr-code"></div>
    </div>
    <div class="meta">
      <div class="url-display" id="url-display"></div>
    </div>
    <div class="dl-row">
      <button class="dl-btn primary" id="dl-png">↓ Download PNG</button>
      <button class="dl-btn" id="copy-btn">Copy to Clipboard</button>
    </div>
  </div>

  <!-- Barcode output -->
  <div class="output bc-output" id="bc-output">
    <div class="bc-grid" id="bc-grid"></div>
    <div class="dl-row">
      <button class="dl-btn primary" id="bc-print">Print labels</button>
    </div>
  </div>

  <!-- Barcode history -->
  <div class="card bc-history" id="bc-history" hidden>
    <div class="bc-history-head">
      <div>
        <label>Codes already used</label>
        <p class="hint" id="bc-count">None yet.</p>
      </div>
      <div class="dl-row">
        <button class="dl-btn" id="bc-export">Export CSV</button>
        <label class="dl-btn" for="bc-import">Import CSV</label>
        <input type="file" id="bc-import" accept=".csv,.txt,text/csv,text/plain" hidden />
      </div>
    </div>
    <p class="hint" id="bc-storage-note" style="margin-top:16px">
      Checking where the used codes are saved…
    </p>
  </div>

  <footer>QR By DigitalMinds — QR codes are made in your browser; used barcode numbers are saved in your Google Sheet.</footer>
</div>

<script>
  /* ── Settings ──
     Paste your Google Apps Script web app address here
     (Apps Script → Deploy → Manage deployments → Web app → URL).
     It looks like https://script.google.com/macros/s/AKfy…/exec */
  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwVDDL2eN1IvCX6eYThzCU-jNJvQjGVRhQUhauYflMFaOaS3x_fif2olSAMlRG5P5Ns/exec';

  // Tabs
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabPanes = document.querySelectorAll('.tab-pane');
  const genBtn = document.getElementById('gen-btn');
  let activeTab = 'url';

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      tabBtns.forEach(b => b.classList.remove('active'));
      tabPanes.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('pane-' + activeTab).classList.add('active');

      const isBc = activeTab === 'barcode';
      document.getElementById('size-group').style.display = isBc ? 'none' : '';
      genBtn.textContent = isBc ? 'Generate Barcode' : 'Generate QR Code';
      showOutputs();
    });
  });

  // Range label
  const sizeRange = document.getElementById('opt-size');
  const sizeLabel = document.getElementById('size-label');
  sizeRange.addEventListener('input', () => sizeLabel.textContent = sizeRange.value);

  // Build QR content
  function buildContent() {
    switch (activeTab) {
      case 'url':
        return document.getElementById('url-input').value.trim() || 'https://example.com';
      case 'text':
        return document.getElementById('text-input').value.trim() || 'Hello, World!';
      case 'wifi': {
        const ssid = document.getElementById('wifi-ssid').value.trim();
        const pass = document.getElementById('wifi-pass').value;
        const sec  = document.getElementById('wifi-sec').value;
        return `WIFI:T:${sec};S:${ssid};P:${pass};;`;
      }
      case 'vcard': {
        const n   = document.getElementById('vc-name').value.trim();
        const ph  = document.getElementById('vc-phone').value.trim();
        const em  = document.getElementById('vc-email').value.trim();
        const url = document.getElementById('vc-url').value.trim();
        const org = document.getElementById('vc-org').value.trim();
        return [
          'BEGIN:VCARD', 'VERSION:3.0',
          n   ? `FN:${n}`   : '',
          org ? `ORG:${org}` : '',
          ph  ? `TEL:${ph}` : '',
          em  ? `EMAIL:${em}` : '',
          url ? `URL:${url}` : '',
          'END:VCARD'
        ].filter(Boolean).join('\n');
      }
      case 'email': {
        const to  = document.getElementById('em-to').value.trim();
        const sub = encodeURIComponent(document.getElementById('em-subject').value.trim());
        const bod = encodeURIComponent(document.getElementById('em-body').value.trim());
        return `mailto:${to}?subject=${sub}&body=${bod}`;
      }
    }
  }

  let qrInstance = null;

  function generateQR() {
    const content = buildContent();
    const size    = parseInt(sizeRange.value);
    const fg      = document.getElementById('opt-fg').value;
    const bg      = document.getElementById('opt-bg').value;

    const qrDiv = document.getElementById('qr-code');
    qrDiv.innerHTML = '';

    if (qrInstance) { try { qrInstance.clear(); } catch(e){} }

    qrInstance = new QRCode(qrDiv, {
      text:          content,
      width:         size,
      height:        size,
      colorDark:     fg,
      colorLight:    bg,
      correctLevel:  QRCode.CorrectLevel.H
    });

    // Short preview
    const disp = document.getElementById('url-display');
    const short = content.length > 60 ? content.slice(0, 57) + '…' : content;
    disp.innerHTML = short.replace(/</g,'&lt;');

    const out = document.getElementById('output');
    out.classList.remove('visible');
    void out.offsetWidth;
    out.classList.add('visible');
  }

  genBtn.addEventListener('click', () => {
    if (activeTab === 'barcode') generateBarcodes();
    else generateQR();

    // Flash button
    genBtn.classList.add('flash');
    setTimeout(() => genBtn.classList.remove('flash'), 300);
  });

  // Download PNG
  document.getElementById('dl-png').addEventListener('click', () => {
    const canvas = document.querySelector('#qr-code canvas');
    if (!canvas) return;
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'qr-code.png';
    a.click();
  });

  // Copy to clipboard
  document.getElementById('copy-btn').addEventListener('click', async () => {
    const canvas = document.querySelector('#qr-code canvas');
    if (!canvas) return;
    try {
      canvas.toBlob(async blob => {
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        const btn = document.getElementById('copy-btn');
        const orig = btn.textContent;
        btn.textContent = '✓ Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
      });
    } catch(e) {
      alert('Copy not supported in this browser — use Download instead.');
    }
  });

  /* ══════════════════════════════════════════════
     BARCODES — PREFIX-XXXXXX, never repeated per prefix.
     Used codes are stored in your Google Sheet by the Apps Script in Code.gs,
     so they survive refreshes and are shared by every computer.
     ══════════════════════════════════════════════ */

  const OLD_STORE_KEY = 'digitalminds-used-barcodes-v1';  // list kept by the older browser-only version
  const prefixInput = document.getElementById('bc-prefix');
  const qtyInput    = document.getElementById('bc-qty');
  const bcInfo      = document.getElementById('bc-info');
  const bcError     = document.getElementById('bc-error');
  const bcOutput    = document.getElementById('bc-output');
  const bcGrid      = document.getElementById('bc-grid');
  const bcHistory   = document.getElementById('bc-history');
  const bcCount     = document.getElementById('bc-count');
  const storageNote = document.getElementById('bc-storage-note');

  // stats = { NEE: 12, ABC: 3 }: how many codes each name has used, as stored on the server
  let stats = {};
  let busy  = false;

  const NOT_SET_MSG = 'Barcodes aren\'t connected to your Google Sheet yet. Paste the web app address into ' +
                      'SHEET_API_URL at the top of this page\'s script.';
  const NO_REACH_MSG = 'Couldn\'t reach the Google Sheet. Check the internet connection, and that the web app ' +
                       'is deployed with "Who has access: Anyone".';

  function apiConfigured() {
    return /^https:\/\/script\.google\.com\/.+\/exec$/.test(SHEET_API_URL.trim());
  }

  // Talk to the Google Apps Script web app.
  // GET to read; POST with a plain-text JSON body (no custom headers, so browsers allow it from any site).
  async function api(action, body) {
    if (!apiConfigured()) throw new Error(NOT_SET_MSG);
    const url = SHEET_API_URL.trim();
    let res;
    try {
      res = body === undefined
        ? await fetch(`${url}?action=${encodeURIComponent(action)}`, { cache: 'no-store' })
        : await fetch(url, { method: 'POST', body: JSON.stringify({ action, ...body }) });
    } catch (e) {
      throw new Error(NO_REACH_MSG);
    }
    let data;
    try {
      data = await res.json();
    } catch (e) {
      throw new Error('The Google Sheet didn\'t answer correctly. Check the web app address, and that it is ' +
        'deployed with "Who has access: Anyone".');
    }
    if (!data.ok) throw new Error(data.error || 'The Google Sheet reported an error.');
    return data;
  }

  function setStorageNote(msg, isError = false) {
    storageNote.textContent = msg;
    storageNote.style.color = isError ? 'var(--danger)' : '';
  }

  // Move codes saved by the older browser-only version onto the server, once
  async function migrateOldBrowserList() {
    let old = null;
    try { old = JSON.parse(localStorage.getItem(OLD_STORE_KEY) || 'null'); } catch (e) { return; }
    if (!old || typeof old !== 'object') return;
    const lines = [];
    Object.keys(old).forEach(p => Object.keys(old[p] || {}).forEach(d => lines.push(`${p}-${d}`)));
    if (lines.length) await api('import', { csv: lines.join('\n') });
    try { localStorage.removeItem(OLD_STORE_KEY); } catch (e) {}
  }

  async function loadStats() {
    try {
      await migrateOldBrowserList();
      const data = await api('stats');
      stats = data.stats || {};
      setStorageNote('Used codes are saved in your Google Sheet, so they stay after a refresh and every ' +
        'computer that opens this page shares the same list. Don\'t delete rows in the sheet.');
    } catch (e) {
      setStorageNote(e.message, true);
    }
    updateBcInfo();
  }

  // "Née Home" → "NEEHOME"
  function cleanPrefix(raw) {
    return raw
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, '');
  }

  function usedCount(prefix) {
    return Object.prototype.hasOwnProperty.call(stats, prefix) ? stats[prefix] : 0;
  }

  function showBcError(msg) {
    bcError.textContent = msg;
    bcError.hidden = !msg;
  }

  function updateBcInfo() {
    const typed = cleanPrefix(prefixInput.value);
    const p = typed || 'NAME';
    const n = typed ? usedCount(typed) : 0;   // no count for the example
    bcInfo.innerHTML = `Codes will look like <strong>${p}-482913</strong>. ` +
      (n ? `${n.toLocaleString()} code${n === 1 ? '' : 's'} already used for ${p}.`
         : 'Letters and digits only; accents and spaces are removed.');

    const prefixes = Object.keys(stats).filter(k => usedCount(k) > 0);
    const total = prefixes.reduce((s, k) => s + usedCount(k), 0);
    bcCount.textContent = total
      ? `${total.toLocaleString()} code${total === 1 ? '' : 's'} across ${prefixes.length} name${prefixes.length === 1 ? '' : 's'}: ` +
        prefixes.map(k => `${k} (${usedCount(k)})`).join(', ')
      : 'None yet.';
  }

  function barcodeOptions(code, scale = 1) {
    return {
      format:       'CODE128',
      text:         code,
      displayValue: true,
      font:         'monospace',
      fontSize:     16 * scale,
      textMargin:   4 * scale,
      height:       70 * scale,
      width:        2 * scale,
      margin:       12 * scale,
      lineColor:    document.getElementById('opt-fg').value,
      background:   document.getElementById('opt-bg').value
    };
  }

  // The Google Sheet script picks the numbers and saves them before answering,
  // so a number can never be given twice, even from two computers at once
  async function generateBarcodes() {
    if (busy) return;
    showBcError('');
    if (typeof JsBarcode === 'undefined') {
      showBcError('The barcode library didn\'t load. Check the internet connection and reload the page.');
      return;
    }

    const prefix = cleanPrefix(prefixInput.value);
    if (!prefix) {
      showBcError('Type your store name or initials first (English letters or digits).');
      prefixInput.focus();
      return;
    }

    const qty = Math.min(100, Math.max(1, parseInt(qtyInput.value, 10) || 1));
    qtyInput.value = qty;

    busy = true;
    genBtn.disabled = true;
    genBtn.textContent = 'Saving…';
    try {
      const data = await api('generate', { prefix, qty });
      stats = data.stats || stats;
      renderBarcodes(data.codes);
      updateBcInfo();
    } catch (e) {
      showBcError(e.message);
    } finally {
      busy = false;
      genBtn.disabled = false;
      genBtn.textContent = activeTab === 'barcode' ? 'Generate Barcode' : 'Generate QR Code';
    }
  }

  function renderBarcodes(list) {
    bcGrid.innerHTML = '';
    list.forEach(code => {
      const label = document.createElement('div');
      label.className = 'bc-label';

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      JsBarcode(svg, code, barcodeOptions(code));

      const actions = document.createElement('div');
      actions.className = 'bc-actions';

      const pngBtn = document.createElement('button');
      pngBtn.className = 'dl-btn';
      pngBtn.textContent = '↓ PNG 40×30';
      pngBtn.addEventListener('click', () => downloadBarcodePNG(code));

      const copyBtn = document.createElement('button');
      copyBtn.className = 'dl-btn';
      copyBtn.textContent = 'Copy code';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code);
          copyBtn.textContent = '✓ Copied';
          setTimeout(() => copyBtn.textContent = 'Copy code', 1500);
        } catch (e) {
          prompt('Copy this code:', code);
        }
      });

      actions.append(pngBtn, copyBtn);
      label.append(svg, actions);
      bcGrid.append(label);
    });

    bcOutput.classList.remove('visible');
    void bcOutput.offsetWidth;
    showOutputs();
  }

  /* ── PNG label: 40 × 30 mm, landscape ──
     203 dpi is what thermal label printers use (8 dots per mm) → 320 × 240 px.
     For an office laser/inkjet printer you can set LABEL_DPI to 300 (→ 472 × 354 px). */
  const LABEL_MM  = { w: 40, h: 30 };
  const LABEL_DPI = 203;
  const mmToPx = mm => Math.round(mm / 25.4 * LABEL_DPI);

  function renderLabelCanvas(code) {
    const W = mmToPx(LABEL_MM.w);
    const H = mmToPx(LABEL_MM.h);
    const pad   = mmToPx(1.5);   // white border, also the scanner's quiet zone
    const gap   = mmToPx(1);     // space between bars and text
    const fg = document.getElementById('opt-fg').value;
    const bg = document.getElementById('opt-bg').value;

    // 1. How many modules (thinnest bar units) this code needs
    const probe = document.createElement('canvas');
    JsBarcode(probe, code, { format: 'CODE128', width: 1, height: 1, margin: 0, displayValue: false });
    const modules = probe.width;

    // 2. Whole pixels per module, as wide as the label allows (whole pixels = sharp bars)
    const dots = Math.max(1, Math.floor((W - 2 * pad) / modules));

    // 3. Text size: start at 3.5 mm and shrink until it fits the width
    const ctx = document.createElement('canvas').getContext('2d');
    let fontSize = mmToPx(3.5);
    ctx.font = `bold ${fontSize}px monospace`;
    while (ctx.measureText(code).width > W - 2 * pad && fontSize > 8) {
      fontSize--;
      ctx.font = `bold ${fontSize}px monospace`;
    }

    // 4. Bars fill the height left over
    const barHeight = H - 2 * pad - fontSize - gap;
    const bars = document.createElement('canvas');
    JsBarcode(bars, code, {
      format: 'CODE128', width: dots, height: barHeight, margin: 0,
      displayValue: false, lineColor: fg, background: bg
    });

    // 5. Put it together on the 40 × 30 mm canvas
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const c = canvas.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);
    c.drawImage(bars, Math.round((W - bars.width) / 2), pad);
    c.fillStyle = fg;
    c.font = `bold ${fontSize}px monospace`;
    c.textAlign = 'center';
    c.textBaseline = 'bottom';
    c.fillText(code, W / 2, H - pad);

    return { canvas, thin: dots < 2 };
  }

  // CRC-32, needed to write a valid PNG chunk
  function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc ^= bytes[i];
      for (let k = 0; k < 8; k++) crc = (crc & 1) ? (crc >>> 1) ^ 0xEDB88320 : crc >>> 1;
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  // Store the DPI inside the PNG (pHYs chunk) so programs print it at 40 × 30 mm
  async function pngWithDpi(canvas, dpi) {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const png = new Uint8Array(await blob.arrayBuffer());
    const view = new DataView(png.buffer);

    // Skip if the browser already wrote a pHYs chunk
    for (let pos = 8; pos < png.length - 8; ) {
      const len  = view.getUint32(pos);
      const type = String.fromCharCode(...png.subarray(pos + 4, pos + 8));
      if (type === 'pHYs') return blob;
      if (type === 'IDAT') break;
      pos += 12 + len;
    }

    const ppm = Math.round(dpi / 0.0254);            // pixels per metre
    const chunk = new Uint8Array(21);
    const cv = new DataView(chunk.buffer);
    cv.setUint32(0, 9);                              // data length
    chunk.set([0x70, 0x48, 0x59, 0x73], 4);          // "pHYs"
    cv.setUint32(8, ppm);
    cv.setUint32(12, ppm);
    chunk[16] = 1;                                   // unit: metre
    cv.setUint32(17, crc32(chunk.subarray(4, 17)));

    const at = 33;                                   // PNG signature (8) + IHDR chunk (25)
    const out = new Uint8Array(png.length + chunk.length);
    out.set(png.subarray(0, at), 0);
    out.set(chunk, at);
    out.set(png.subarray(at), at + chunk.length);
    return new Blob([out], { type: 'image/png' });
  }

  async function downloadBarcodePNG(code) {
    const { canvas, thin } = renderLabelCanvas(code);
    const blob = await pngWithDpi(canvas, LABEL_DPI);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${code}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

    if (thin) {
      showBcError(`"${code.split('-')[0]}" is long, so the bars on a 40 × 30 mm label are very thin ` +
        'and may not scan. Initials of up to 5 letters work best.');
    }
  }

  // Show the QR result or the barcode result, depending on the open tab
  function showOutputs() {
    const isBc = activeTab === 'barcode';
    document.getElementById('output').classList.toggle('visible', !isBc && qrInstance !== null);
    bcOutput.classList.toggle('visible', isBc && bcGrid.children.length > 0);
    bcHistory.hidden = !isBc;
  }

  // Print only the barcode labels
  document.getElementById('bc-print').addEventListener('click', () => {
    document.body.classList.add('print-bc');
    window.print();
  });
  window.addEventListener('afterprint', () => document.body.classList.remove('print-bc'));

  // Export every used code as CSV, straight from the Google Sheet
  document.getElementById('bc-export').addEventListener('click', async () => {
    showBcError('');
    try {
      if (!apiConfigured()) throw new Error(NOT_SET_MSG);
      let res;
      try {
        res = await fetch(`${SHEET_API_URL.trim()}?action=export`, { cache: 'no-store' });
      } catch (e) {
        throw new Error(NO_REACH_MSG);
      }
      if (!res.ok || (res.headers.get('Content-Type') || '').includes('json')) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'The Google Sheet reported an error.');
      }
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'used-barcodes.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (e) {
      showBcError(e.message);
    }
  });

  // Import a CSV (or any list) with codes like NEE-482913 in the first column
  document.getElementById('bc-import').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    showBcError('');
    try {
      const data = await api('import', { csv: await file.text() });
      stats = data.stats || stats;
      updateBcInfo();
      alert(data.added
        ? `${data.added} code${data.added === 1 ? '' : 's'} added to the used list.`
        : 'No new codes found in that file.');
    } catch (err) {
      showBcError(err.message);
    } finally {
      e.target.value = '';
    }
  });

  prefixInput.addEventListener('input', () => { showBcError(''); updateBcInfo(); });
  prefixInput.addEventListener('keydown', e => { if (e.key === 'Enter') genBtn.click(); });
  qtyInput.addEventListener('keydown', e => { if (e.key === 'Enter') genBtn.click(); });

  updateBcInfo();
  loadStats();
</script>
</body>
</html>
